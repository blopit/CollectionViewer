<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Video Card (Simple)</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; touch-action: none; background: #000; }
    canvas { display: block; }
    
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      z-index: 1000;
    }
    
    #status {
      margin: 20px 0;
      font-size: 18px;
    }
    
    .spinner {
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 5px solid white;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div id="status">Loading libraries...</div>
  </div>
  
  <script type="module">
    // Import Three.js from CDN
    import * as THREE from 'https://unpkg.com/three@0.175.0/build/three.module.js';
    
    // App initialization code
    const init = async () => {
      const loadingElement = document.getElementById('loading');
      const statusElement = document.getElementById('status');
      
      // Create a canvas element
      const canvas = document.createElement('canvas');
      canvas.id = 'canvas';
      document.body.appendChild(canvas);
      
      try {
        // Try to load GSAP
        statusElement.textContent = 'Loading GSAP...';
        await loadScript('https://unpkg.com/gsap@3.12.5/dist/gsap.min.js');
        
        statusElement.textContent = 'Setting up scene...';
        setupScene();
        
        // Remove loading screen
        loadingElement.style.display = 'none';
      } catch (error) {
        statusElement.textContent = `Error: ${error.message}`;
        statusElement.style.color = 'red';
      }
    };
    
    // Helper function to load scripts
    const loadScript = (url) => {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load ${url}`));
        document.head.appendChild(script);
      });
    };
    
    // Set up the Three.js scene
    const setupScene = () => {
      // Set up Three.js
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 2);

      const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('canvas'), alpha: true});
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      // Card geometry (simple colored card as placeholder)
      const geometry = new THREE.PlaneGeometry(1, 1.5);
      const material = new THREE.MeshBasicMaterial({ 
        color: 0x3366cc,
        side: THREE.DoubleSide
      });
      
      const card = new THREE.Mesh(geometry, material);
      scene.add(card);

      // Handle window resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Touch Interaction
      let touchStart = null;
      let isDragging = false;

      window.addEventListener('touchstart', (e) => {
        touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
        isDragging = true;
      });

      window.addEventListener('touchmove', (e) => {
        if (!isDragging || !touchStart) return;
        
        const dx = (e.touches[0].clientX - touchStart.x) / window.innerWidth;
        const dy = (e.touches[0].clientY - touchStart.y) / window.innerHeight;
        
        card.rotation.y = dx * Math.PI / 4;
        card.rotation.x = -dy * Math.PI / 4;
      });

      window.addEventListener('touchend', () => {
        isDragging = false;
        gsap.to(card.rotation, {
          x: 0, 
          y: 0, 
          duration: 0.8, 
          ease: "elastic.out(1, 0.3)"
        });
      });

      // Animation loop
      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      
      // Start animation
      animate();
    };
    
    // Start loading when page is ready
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
