<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Tilt Card</title>
  <style>
    :root {
      --rotateX: 0deg;
      --rotateY: 0deg;
      --perspective: 800px;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      -webkit-overflow-scrolling: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .scene {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: var(--perspective);
      touch-action: none;
    }
    .card {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
      transform-style: preserve-3d;
      transform: rotateX(calc(180deg + var(--rotateX))) rotateY(var(--rotateY));
      transition: transform 0.1s ease-out;
    }
    .layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }
    .layer[data-depth] {
      transform: translateZ(calc(var(--depth) * 1px));
    }
    .layer video, .layer .text {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
    }
    #videoCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Settings panel styles */
    #settings-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      cursor: pointer;
      z-index: 1000;
      padding: 12px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    #settings-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }

    #settings-panel {
      position: fixed;
      bottom: -100%;
      right: 20px;
      width: min(300px, calc(100% - 40px));
      background: rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      padding: 20px;
      color: white;
      transition: transform 0.3s ease;
      z-index: 999;
      max-height: 80vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      pointer-events: none;
    }

    #settings-panel.visible {
      transform: translateY(-120%);
      pointer-events: auto;
    }

    .setting-row {
      margin: 15px 0;
    }

    .setting-row label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .setting-row input[type="range"] {
      width: 100%;
      height: 30px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      outline: none;
      margin: 10px 0;
    }

    .setting-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 30px;
      height: 30px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
    }

    #debug {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: white;
      font-family: monospace;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      z-index: 1000;
    }

    #processing-overlay {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      display: none;
      z-index: 1000;
    }

    .progress-bar {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-top: 10px;
    }

    .progress-bar-fill {
      height: 100%;
      background: #4CAF50;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .status-text {
      margin-bottom: 8px;
    }

    #random-video-btn {
      padding: 12px 24px !important;
      background: rgba(255,255,255,0.2) !important;
      border: none !important;
      color: white !important;
      border-radius: 8px !important;
      cursor: pointer !important;
      font-size: 16px !important;
      width: 100% !important;
      margin: 10px 0 !important;
      -webkit-tap-highlight-color: transparent !important;
      touch-action: manipulation !important;
    }

    #random-video-btn:active {
      background: rgba(255,255,255,0.3) !important;
    }

    @media (max-width: 768px) {
      .scene {
        z-index: 1;
      }

      #settings-panel {
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        border-radius: 12px 12px 0 0;
        padding: 20px;
        max-height: 85vh;
        touch-action: pan-y;
        background: rgba(0, 0, 0, 0.95);
        transform: translateY(100%);
        overflow-y: scroll;
        transition: transform 0.3s ease;
      }

      #settings-panel.visible {
        transform: translateY(15%);
      }

      #settings-panel::after {
        content: '';
        display: block;
        height: 40px;
      }

      #settings-panel h3 {
        margin-bottom: 20px;
      }

      .setting-row {
        margin: 20px 0;
        padding: 10px 0;
      }

      .setting-row input[type="range"] {
        margin: 15px 0;
      }

      .setting-row:last-child {
        margin-bottom: 40px;
        padding-bottom: 20px;
      }

      #settings-btn {
        bottom: 20px;
        right: 20px;
        filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
      }

      .setting-row label {
        font-size: 16px;
      }
    }

    /* Prevent body scroll when panel is open */
    body.panel-open {
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="card" id="card">
      <!-- Video layer with depth map using Three.js -->
      <div class="layer" style="--depth: 0;">
        <canvas id="videoCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Debug info -->
  <div id="debug"></div>

  <!-- Settings panel -->
  <button id="settings-btn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
    </svg>
  </button>

  <div id="settings-panel">
    <h3>3D Effect Settings</h3>
    <div class="setting-row">
      <label for="effect-strength">Effect Strength</label>
      <input type="range" id="effect-strength" min="0" max="5" step="0.1" value="2.5">
    </div>
    <div class="setting-row">
      <label for="shine-strength">Shine</label>
      <input type="range" id="shine-strength" min="0" max="3" step="0.1" value="0.8">
    </div>
    <div class="setting-row">
      <label for="depth-contrast">Contrast</label>
      <input type="range" id="depth-contrast" min="0.5" max="5" step="0.1" value="2.0">
    </div>
    <div class="setting-row">
      <label for="depth-smoothing">Smoothing</label>
      <input type="range" id="depth-smoothing" min="0" max="1" step="0.01" value="0.5">
    </div>
    <div class="setting-row" style="text-align: center; margin-top: 20px;">
      <button id="random-video-btn" style="padding: 8px 16px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 4px; cursor: pointer;">
        Load Random Video
      </button>
      <a href="collection.html" id="collection-btn" style="display: inline-block; padding: 8px 16px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 4px; cursor: pointer; text-decoration: none; margin-top: 10px;">
        View Collection
      </a>
    </div>
  </div>

  <!-- Hidden videos for Three.js textures -->
  <video id="colorVideo" src="video.mp4" loop muted playsinline crossorigin="anonymous" style="display:none"></video>
  <video id="depthVideo" src="depth_video.mp4" loop muted playsinline crossorigin="anonymous" style="display:none"></video>

  <div id="processing-overlay">
    <div class="status-text">Processing video...</div>
    <div class="progress-bar">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="test-viewer.js"></script>
  <script src="test-random-video-api.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    // Check for selected video from collection
    const selectedVideo = sessionStorage.getItem('selectedVideo');
    if (selectedVideo) {
      const videoData = JSON.parse(selectedVideo);
      const colorVideo = document.getElementById('colorVideo');
      const depthVideo = document.getElementById('depthVideo');
      
      // Update video sources
      colorVideo.src = videoData.originalVideo;
      depthVideo.src = videoData.depthVideo;
      
      // Clear selection
      sessionStorage.removeItem('selectedVideo');
      
      // Reload videos
      colorVideo.load();
      depthVideo.load();
      
      // Start playing when both videos are ready
      Promise.all([
        new Promise(resolve => colorVideo.addEventListener('canplay', resolve, {once: true})),
        new Promise(resolve => depthVideo.addEventListener('canplay', resolve, {once: true}))
      ]).then(() => {
        colorVideo.play();
        depthVideo.play();
      });
    }
    
    const settingsBtn = document.getElementById('settings-btn');
    const settingsPanel = document.getElementById('settings-panel');
    
    // Debug logging function
    function debugLog(message) {
        console.log(`[Debug] ${message}`);
    }

    // Handle settings button click/touch
    function toggleSettings(e) {
        debugLog('Toggle settings called');
        e.preventDefault();
        e.stopPropagation();
        
        const isVisible = settingsPanel.classList.contains('visible');
        debugLog(`Panel is currently ${isVisible ? 'visible' : 'hidden'}`);
        
        if (isVisible) {
            settingsPanel.classList.remove('visible');
            document.body.classList.remove('panel-open');
            debugLog('Panel hidden');
        } else {
            settingsPanel.classList.add('visible');
            document.body.classList.add('panel-open');
            debugLog('Panel shown');
        }
    }

    // Add both click and touch events for better mobile support
    settingsBtn.addEventListener('click', function(e) {
        debugLog('Click event on settings button');
        toggleSettings(e);
    });

    settingsBtn.addEventListener('touchstart', function(e) {
        debugLog('Touch event on settings button');
        toggleSettings(e);
    });

    // Prevent touch events from propagating through the panel
    settingsPanel.addEventListener('touchstart', (e) => {
        if (settingsPanel.classList.contains('visible')) {
            debugLog('Panel touch event stopped');
            e.stopPropagation();
        }
    }, { passive: true });

    settingsPanel.addEventListener('touchmove', (e) => {
        if (settingsPanel.classList.contains('visible')) {
            debugLog('Panel move event stopped');
            e.stopPropagation();
        }
    }, { passive: true });

    // Close panel when clicking outside
    document.addEventListener('click', (e) => {
        if (settingsPanel.classList.contains('visible') && 
            !settingsPanel.contains(e.target) && 
            !settingsBtn.contains(e.target)) {
            debugLog('Outside click - closing panel');
            settingsPanel.classList.remove('visible');
            document.body.classList.remove('panel-open');
        }
    });

    // Log initial state
    debugLog('Settings panel initialized');
  });
  </script>
</body>
</html>
