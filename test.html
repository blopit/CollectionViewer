<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Test</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; }
    #info { position: absolute; top: 10px; width: 100%; text-align: center; z-index: 100; }
  </style>
</head>
<body>
  <div id="info">Three.js Test</div>

  <script type="module">
    // Import Three.js directly
    import * as THREE from 'https://unpkg.com/three@0.175.0/build/three.module.js';
    
    // Wait for DOM to load
    document.addEventListener('DOMContentLoaded', () => {
      const infoElement = document.getElementById('info');
      infoElement.textContent = 'Three.js loaded successfully!';
      
      // Create a simple Three.js scene
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      
      // Create a cube
      const geometry = new THREE.BoxGeometry();
      const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
      const cube = new THREE.Mesh(geometry, material);
      scene.add(cube);
      
      camera.position.z = 5;
      
      // Animation loop
      function animate() {
        requestAnimationFrame(animate);
        cube.rotation.x += 0.01;
        cube.rotation.y += 0.01;
        renderer.render(scene, camera);
      }
      animate();
    });
  </script>
</body>
</html>
