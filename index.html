<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mesh Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r162/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/controls/DeviceOrientationControls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/loaders/GLTFLoader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/loaders/PLYLoader.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>3D Mesh Viewer</h1>
        </header>
        
        <main>
            <div id="viewer-container">
                <div id="scene-container"></div>
                <div id="loading">Loading Model...</div>
            </div>
            
            <div class="controls">
                <div class="control-section">
                    <h2>View Controls</h2>
                    <button id="reset-view">Reset View</button>
                    <div class="slider-container">
                        <label for="zoom-slider">Zoom:</label>
                        <input type="range" id="zoom-slider" min="0" max="9" step="0.1" value="5">
                    </div>
                </div>
                
                <div class="control-section">
                    <h2>Model Information</h2>
                    <div id="model-info" class="info-box">
                        <p>This 3D model represents a reconstructed mesh from multiple images.</p>
                        <p>Use mouse or touch to rotate, zoom, and pan the view.</p>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2023 Mesh Viewer. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
