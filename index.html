<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Viewer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎥</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: 'Poppins', sans-serif;
    }

    .container {
      position: fixed;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .canvas-container {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      touch-action: none;
      z-index: 1;
    }

    video {
      position: absolute;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: white;
    }

    .loading-screen.hidden {
      display: none;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #ffffff3d;
      border-top: 3px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #settings-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      cursor: pointer;
      z-index: 100;
      padding: 8px;
    }

    #settings-btn svg {
      width: 100%;
      height: 100%;
      fill: white;
    }

    #settings-panel {
      position: fixed;
      bottom: -200px;
      right: 20px;
      width: 300px;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      padding: 20px;
      color: white;
      transition: transform 0.3s ease;
      z-index: 99;
    }

    #settings-panel.visible {
      transform: translateY(-220px);
    }

    .setting-row {
      margin: 15px 0;
    }

    .setting-row label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .setting-row input[type="range"] {
      width: 100%;
      height: 20px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      outline: none;
    }

    .setting-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="canvas-container">
      <canvas id="canvas"></canvas>
      <video id="original-video" playsinline webkit-playsinline autoplay muted loop crossorigin="anonymous"></video>
      <video id="depth-video" playsinline webkit-playsinline autoplay muted loop crossorigin="anonymous"></video>
    </div>

    <div class="loading-screen" id="loading-screen">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>

    <button id="settings-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
      </svg>
    </button>

    <div id="settings-panel">
      <h3>3D Effect Settings</h3>
      <div class="setting-row">
        <label for="effect-strength">Effect Strength</label>
        <input type="range" id="effect-strength" min="0" max="5" step="0.1" value="2.5">
      </div>
      <div class="setting-row">
        <label for="shine-strength">Shine</label>
        <input type="range" id="shine-strength" min="0" max="3" step="0.1" value="0.8">
      </div>
      <div class="setting-row">
        <label for="depth-contrast">Contrast</label>
        <input type="range" id="depth-contrast" min="0.5" max="5" step="0.1" value="2.0">
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
