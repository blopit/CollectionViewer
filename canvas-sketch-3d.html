<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Object Customization</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1f1e1c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1f1e1c;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 1000;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Loading 3D objects...</p>
  </div>

  <script>
    // Hide loading screen when window is loaded
    window.addEventListener('load', () => {
      // Give a little extra time for Three.js to initialize
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
      }, 1000);
    });
  </script>
  
  <!-- Include canvas-sketch-cli -->
  <script src="node_modules/canvas-sketch-cli/dist/canvas-sketch-cli.js"></script>
  
  <!-- Include our sketch -->
  <script src="canvas-sketch-3d.js"></script>
</body>
</html>
